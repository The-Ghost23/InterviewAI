# Paid compute: review the selected plan in Render before creating this service.
services:
  - type: web
    name: interviewai-api
    runtime: python
    rootDir: backend
    buildCommand: uv sync --locked --no-dev --python 3.12 && .venv/bin/python scripts/prepare_speech.py
    startCommand: .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: standard
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /api/health
    preDeployCommand: .venv/bin/alembic upgrade head
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.16
      - key: UV_VERSION
        value: 0.13.7
      - key: APP_ENV
        value: production
      - key: AI_PROVIDER
        value: runpod
      - key: RUNPOD_MODEL
        value: Qwen/Qwen3-4B
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: RUNPOD_BASE_URL
        sync: false
      - key: RUNPOD_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
